# MOB Guard — one-click deploy on Render (free tier).
#
# How to use (no coding):
#   1. Sign up at render.com (free, no credit card).
#   2. Dashboard → New → Blueprint → connect your GitHub account
#      and select the satyam1124/MARS-SITE repo.
#   3. Render reads this file and shows the plan → click Apply.
#   4. Done. Every push to GitHub `main` redeploys automatically.
#   5. Open https://mob-guard.onrender.com/dashboard.html
#      and log in with admin / admin123.
#
# Notes:
#   - JWT_SECRET is auto-generated by Render (generateValue) — nothing to copy.
#   - Free tier sleeps after 15 min of inactivity and wakes (~30-60s)
#     on the next visit. The dashboard shows demo data while it wakes.
#   - Render's free disk is ephemeral: backend/data.json resets on each
#     redeploy/restart (auto-seeds on boot). Fine for a demo.

services:
  - type: web
    name: mob-guard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
